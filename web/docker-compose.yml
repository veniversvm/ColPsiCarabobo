services:
  web:
    build:
      context: .
      dockerfile: dockerfile
    container_name: colpsi_web
    env_file: .env
    environment:
      # IMPORTANTE: Al ser SSR/Server Actions, Deno llama a la API por la red interna
      - VITE_API_URL=http://colpsi_api:8080/api/v1
      - API_URL_INTERNAL=http://colpsi_api:8080/api/v1
      - PORT=3000
    ports:
      - "23000:3000"
    networks:
      - colpsi_network
    restart: unless-stopped

networks:
  colpsi_network:
    name: api_colpsi_network
    external: true