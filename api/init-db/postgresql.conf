# Ajustes para servidor Contabo 4 vCPU / 8 GB.
# Se monta en el contenedor y se aplica vía `-c config_file=` en el comando.
#
# NOTA: al reemplazar el postgresql.conf de la imagen (18/docker), hay que
# conservar los valores base que trae (listen_addresses='*', lc_*, timezone,
# wal sizes) o las conexiones de pgbouncer/api fallan con "connection refused".

# ── Base conservada de la imagen postgres:18-alpine ─────────────────────────
listen_addresses = '*'
port = 5432
dynamic_shared_memory_type = posix
max_wal_size = 1GB
min_wal_size = 80MB
log_timezone = 'UTC'
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# ── Memoria (25% de la RAM para shared_buffers) ─────────────────────────────
shared_buffers = 2GB
# Caché efectiva: shared_buffers + page cache del SO (solo pista para el planner).
effective_cache_size = 6GB
# Memoria por operación de ordenación/hash (por worker; 2 workers × 16MB = 32MB/query).
work_mem = 16MB
# Operaciones de mantenimiento (VACUUM, CREATE INDEX, migraciones Atlas).
maintenance_work_mem = 256MB

# ── Conexiones ───────────────────────────────────────────────────────────────
# Basta: PgBouncer mantiene un pool de 20 conexiones de servidor.
max_connections = 40

# ── CPU: nunca comerse las 4 vCPU ────────────────────────────────────────────
# Un query paralelo usa 1 líder + hasta 2 workers = máx 3 vCPU.
max_parallel_workers = 2
max_parallel_workers_per_gather = 2
# Trabajadores de fondo (parallel + autovacuum + wal). Límite total de procesos.
max_worker_processes = 4

# ── Timeouts (red de seguridad para conexiones no-API) ───────────────────────
# La API ya fija statement_timeout=30s vía DSN; esto cubre psql/migraciones/directo.
statement_timeout = 30s
# Sesiones muertas en transacción liberan el backend pined de PgBouncer.
idle_in_transaction_session_timeout = 30s
