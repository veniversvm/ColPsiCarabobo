<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0; padding:0; background-color:#f3f4f6;">

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#f3f4f6">
        <tr>
            <td align="center" style="padding:24px 12px;">

                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px; background:#ffffff; border-radius:16px; overflow:hidden; border:1px solid #e5e7eb;">

                    <!-- HEADER INSTITUCIONAL -->
                    <tr>
                        <td bgcolor="#1e3a8a" style="padding:20px 24px;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td align="center" style="font-family:Arial,Helvetica,sans-serif; font-size:22px; font-weight:bold; color:#ffffff;">
                                        Colegio de Psicólogos del Estado Carabobo
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- CUERPO -->
                    <tr>
                        <td style="padding:32px 24px;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td style="font-family:Arial,Helvetica,sans-serif; font-size:20px; font-weight:bold; color:#111827; padding-bottom:16px;">
                                        {{.Title}}
                                    </td>
                                </tr>
                                <tr>
                                    <td style="font-family:Arial,Helvetica,sans-serif; font-size:15px; line-height:1.6; color:#374151;">
                                        {{.Message}}
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- FOOTER -->
                    <tr>
                        <td bgcolor="#f9fafb" style="padding:16px 24px; border-top:1px solid #e5e7eb;">
                            <p style="font-family:Arial,Helvetica,sans-serif; font-size:13px; color:#6b7280; margin:0;">
                                Enviado por el Colegio de Psicólogos del Estado Carabobo.<br>
                                Para más información visita {{.SiteURL}}.<br><br>
                                {{.Signature}}
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
