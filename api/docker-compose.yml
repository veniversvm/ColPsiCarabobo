services:
  # 1. Base de Datos real (Postgres)
  db:
    image: postgres:18-alpine
    container_name: colpsi_db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      # PostgreSQL 18+ requiere montar en /var/lib/postgresql (usa subdirectorio por versión)
      - postgres_data:/var/lib/postgresql
      - ./init-db:/docker-entrypoint-initdb.d 
      - ./init-db/pg_hba.conf:/etc/postgresql/pg_hba.conf
    command: postgres -c hba_file=/etc/postgresql/pg_hba.conf
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    networks:
      - colpsi_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. PgBouncer
  pgbouncer:
    image: edoburu/pgbouncer
    container_name: colpsi_pgbouncer
    restart: always
    environment:
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=colpsi_db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-colpsi_db}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=20
      - AUTH_TYPE=scram-sha-256
      - ADMIN_USERS=${DB_USER:-postgres}
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits,search_path
    ports:
      - "${PGBOUNCER_HOST_PORT:-6432}:5432"
    networks:
      - colpsi_network
    depends_on:
      db:
        condition: service_healthy

   # 👇 NUEVO CONTENEDOR MIGRADOR 👇
  migrador:
    image: arigaio/atlas:latest-alpine
    container_name: colpsi_migrador
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # CORRECCIÓN: Como el compose ya está en /api, la ruta es ./migrations
      - ./migrations:/migrations
    # Usamos la ruta absoluta del contenedor (/migrations) para evitar errores
    command: >
      migrate apply 
      --dir "file:///migrations" 
      --url "postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-colpsi_db}?sslmode=disable"
    networks:
      - colpsi_network


  # 3. API Go
  api:
    build:
      context: .
      dockerfile: dockerfile
    container_name: colpsi_api
    env_file: .env
    ports:
      - "8080:8080" 
    environment:
      # Sobrescribimos localhost para que apunte a los contenedores internos
      - DB_HOST=pgbouncer
      - DB_PORT=5432
      - S3_ENDPOINT=http://s3:9000
      # Pública: accesible desde el navegador (endpoint/bucket)
      - S3_PUBLIC_URL=http://localhost:9000
      - VALKEY_ADDR=valkey:6379
      - PORT=8080
    networks:
      - colpsi_network
    depends_on:
      pgbouncer:
        condition: service_started
      s3:
        condition: service_started
      migrador:
        condition: service_completed_successfully
    restart: unless-stopped
    # Descomenta la siguiente línea si necesitas probar la API desde afuera sin Deno
    # ports:
    #   - "5555:5555"

  # 4. pgAdmin (Solo Dev)
  pgadmin:
    image: dpage/pgadmin4
    container_name: colpsi_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@admin.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - db
    networks:
      - colpsi_network
    profiles:
      - dev

  # 5. MailHog (Solo Dev)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: colpsi_mailhog
    ports:
      - "1025:1025"   # SMTP server
      - "8025:8025"   # Web UI (http://localhost:8025)
    environment:
      - MH_API_BIND_ADDR=0.0.0.0:8025
      - MH_SMTP_BIND_ADDR=0.0.0.0:1025
    networks:
      - colpsi_network
    profiles:
      - dev

  # 6. Valkey (rate limiting store)
  valkey:
    image: valkey/valkey:9.1-alpine
    container_name: colpsi_valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: valkey-server --save 60 1 --loglevel warning
    networks:
      - colpsi_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 7. MinIO
  s3:
    image: minio/minio
    container_name: colpsi_s3
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${AWS_ACCESS_KEY_ID:-minioadmin}
      - MINIO_ROOT_PASSWORD=${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - colpsi_network

  # 8. Helper MinIO
  createbuckets:
    image: minio/mc
    depends_on:
      - s3
    networks:
      - colpsi_network
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://s3:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin}) do echo 'Esperando a MinIO...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing myminio/${AWS_S3_BUCKET:-colpsi-bucket};
      /usr/bin/mc anonymous set public myminio/${AWS_S3_BUCKET:-colpsi-bucket};
      exit 0;
      "

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    ports:
      - "1337:80" # Mapea el puerto 1337 de tu máquina al 80 del contenedor
    volumes:
      # Carpetas para tus archivos multimedia
      - ./biblioteca/audiobooks:/audiobooks
      - ./biblioteca/books:/books
      # Carpetas críticas donde se guarda tu progreso de lectura y configuración
      - ./biblioteca/config:/config
      - ./biblioteca/metadata:/metadata
    environment:
      - AUDIOBOOKSHELF_UID=1000
      - AUDIOBOOKSHELF_GID=1000
    networks:
      - colpsi_network

volumes:
  postgres_data:
  minio_data:
  valkey_data:

networks:
  colpsi_network:
    driver: bridge