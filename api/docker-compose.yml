services:
  # 1. Base de Datos real (Postgres)
  db:
    image: postgres:17-alpine
    container_name: colpsi_db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    networks:
      - colpsi_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. PgBouncer
  pgbouncer:
    image: edoburu/pgbouncer
    container_name: colpsi_pgbouncer
    restart: always
    environment:
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=colpsi_db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-colpsi_db}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=20
      - AUTH_TYPE=scram-sha-256
      - ADMIN_USERS=${DB_USER:-postgres}
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits,search_path
    ports:
      - "${PGBOUNCER_HOST_PORT:-6432}:5432"
    networks:
      - colpsi_network
    depends_on:
      db:
        condition: service_healthy

  # 3. API Go
  # api:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: colpsi_api
  #   env_file: .env
  #   ports:
  #     - "8080:8080" 
  #   environment:
  #     # Sobrescribimos localhost para que apunte a los contenedores internos
  #     - DB_HOST=pgbouncer
  #     - DB_PORT=5432
  #     - S3_ENDPOINT=http://s3:9000
  #     - PORT=8080
  #   networks:
  #     - colpsi_network
  #   depends_on:
  #     pgbouncer:
  #       condition: service_started
  #     s3:
  #       condition: service_started
  #   restart: unless-stopped
    # Descomenta la siguiente línea si necesitas probar la API desde afuera sin Deno
    # ports:
    #   - "5555:5555"

  # 4. pgAdmin (Solo Dev)
  pgadmin:
    image: dpage/pgadmin4
    container_name: colpsi_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@admin.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - db
    networks:
      - colpsi_network
    profiles:
      - dev

  # 5. MinIO
  s3:
    image: minio/minio
    container_name: colpsi_s3
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${AWS_ACCESS_KEY_ID:-minioadmin}
      - MINIO_ROOT_PASSWORD=${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - colpsi_network

  # 6. Helper MinIO
  createbuckets:
    image: minio/mc
    depends_on:
      - s3
    networks:
      - colpsi_network
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://s3:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin}) do echo 'Esperando a MinIO...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing myminio/${AWS_S3_BUCKET:-colpsi-bucket};
      /usr/bin/mc anonymous set public myminio/${AWS_S3_BUCKET:-colpsi-bucket};
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:

networks:
  colpsi_network:
    driver: bridge