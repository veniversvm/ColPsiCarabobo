services:
  # 1. Base de Datos real (Postgres)
  db:
    image: postgres:18-alpine
    container_name: colpsi_db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      # PostgreSQL 18+ requiere montar en /var/lib/postgresql (usa subdirectorio por versión)
      - postgres_data:/var/lib/postgresql
      - ./init-db:/docker-entrypoint-initdb.d 
      - ./init-db/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./init-db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c hba_file=/etc/postgresql/pg_hba.conf -c config_file=/etc/postgresql/postgresql.conf
    # Contabo 4 vCPU/8GB: tope duro de CPU en 3 y de memoria para no ahogar el host.
    cpus: "3.0"
    mem_limit: 3.5g
    ports:
      - "${POSTGRES_HOST_PORT:-25432}:5432"
    networks:
      - colpsi_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. PgBouncer
  pgbouncer:
    image: edoburu/pgbouncer
    container_name: colpsi_pgbouncer
    restart: always
    environment:
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=colpsi_db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-colpsi_db}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=200
      - DEFAULT_POOL_SIZE=20
      - AUTH_TYPE=scram-sha-256
      - ADMIN_USERS=${DB_USER:-postgres}
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits,search_path
    cpus: "0.5"
    mem_limit: 256m
    ports:
      - "${PGBOUNCER_HOST_PORT:-26432}:5432"
    networks:
      - colpsi_network
    depends_on:
      db:
        condition: service_healthy

   # 👇 NUEVO CONTENEDOR MIGRADOR 👇
  migrador:
    image: arigaio/atlas:latest-alpine
    container_name: colpsi_migrador
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # CORRECCIÓN: Como el compose ya está en /api, la ruta es ./migrations
      - ./migrations:/migrations
    # Usamos la ruta absoluta del contenedor (/migrations) para evitar errores
    command: >
      migrate apply 
      --dir "file:///migrations" 
      --url "postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-colpsi_db}?sslmode=disable"
    networks:
      - colpsi_network


  # 3. API Go
  api:
    build:
      context: .
      dockerfile: dockerfile
    container_name: colpsi_api
    env_file: .env
    ports:
      - "28080:8080" 
    environment:
      # Sobrescribimos localhost para que apunte a los contenedores internos
      - DB_HOST=pgbouncer
      - DB_PORT=5432
      - S3_ENDPOINT=http://s3:9000
      # Pública: accesible desde el navegador (endpoint/bucket). Viene del .env;
      # en dev por defecto http://localhost:29000 (imgcache).
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-http://localhost:29000}
      - VALKEY_ADDR=valkey:6379
      # Interna: el API habla con ABS por su nombre de red (la pública la pone
      # ABS_PUBLIC_URL desde .env, para el navegador).
      - ABS_BASE_URL=http://audiobookshelf:80
      - PORT=8080
      # Hora local del contenedor (Venezuela) para timestamps de correos (LoginTime)
      - TZ=America/Caracas
      # Límite de paralelismo del runtime Go: 3 vCPU (nunca las 4 del host).
      - GOMAXPROCS=${GOMAXPROCS:-3}
    cpus: "3.0"
    mem_limit: 1g
    networks:
      - colpsi_network
    depends_on:
      pgbouncer:
        condition: service_started
      s3:
        condition: service_started
      migrador:
        condition: service_completed_successfully
    restart: unless-stopped

  # 4. pgAdmin (Solo Dev)
  pgadmin:
    image: dpage/pgadmin4
    container_name: colpsi_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@admin.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:25050:80"
    depends_on:
      - db
    networks:
      - colpsi_network
    profiles:
      - dev

  # 5. MailHog / Mailpit (SOLO Dev)
  # No se levanta en producción. El estado se controla con MAILPIT_PROFILE:
  #   - Dev:  MAILPIT_PROFILE=dev en .env → `docker compose --profile dev up -d`
  #   - Prod: sin MAILPIT_PROFILE (o vacío) → el profile queda en "disabled",
  #           que nunca se activa → el servicio NO se levanta.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: colpsi_mailhog
    profiles: ["${MAILPIT_PROFILE:-disabled}"]
    ports:
      - "21025:1025"   # SMTP server
      - "28025:8025"   # Web UI (http://localhost:28025)
    environment:
      - MH_API_BIND_ADDR=0.0.0.0:28025
      - MH_SMTP_BIND_ADDR=0.0.0.0:21025
    networks:
      - colpsi_network

  # 6. Valkey (rate limiting store)
  valkey:
    image: valkey/valkey:9.1-alpine
    container_name: colpsi_valkey
    ports:
      - "26379:6379"
    volumes:
      - valkey_data:/data
    command: valkey-server --save "" --appendonly no --maxmemory 512mb --maxmemory-policy allkeys-lru --maxclients 512 --loglevel warning
    # Valkey es single-threaded: usa 1 núcleo por diseño. Tope de memoria para no OOM al host.
    cpus: "1.0"
    mem_limit: 768m
    networks:
      - colpsi_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 7. MinIO
  s3:
    image: minio/minio
    container_name: colpsi_s3
    restart: always
    ports:
      # 29000 quedó reservado para el edge cache nginx (imgcache).
      # 29001: consola MinIO.
      # 29002: acceso DIRECTO al SDK desde el host (S3_ENDPOINT en dev local).
      - "29001:9001"
      - "29002:9000"
    environment:
      - MINIO_ROOT_USER=${AWS_ACCESS_KEY_ID:-minioadmin}
      - MINIO_ROOT_PASSWORD=${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    cpus: "2.0"
    mem_limit: 1.5g
    networks:
      - colpsi_network

  # 7b. Edge cache Nginx delante de MinIO
  # Ocupa el puerto 29000 (S3_PUBLIC_URL) y cachea las imágenes en disco local.
  # MinIO queda solo en la red interna (s3:9000) para el SDK y la consola 29001.
  imgcache:
    image: nginx:alpine
    container_name: colpsi_imgcache
    restart: always
    depends_on:
      - s3
    ports:
      - "29000:80"
    volumes:
      - ./nginx-imgcache.conf:/etc/nginx/nginx.conf:ro
      - imgcache_data:/var/cache/nginx
    mem_limit: 512m
    networks:
      - colpsi_network

  # 8. Helper MinIO
  createbuckets:
    image: minio/mc
    depends_on:
      - s3
    networks:
      - colpsi_network
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://s3:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin}) do echo 'Esperando a MinIO...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing myminio/${AWS_S3_BUCKET:-colpsi-bucket};
      /usr/bin/mc anonymous set public myminio/${AWS_S3_BUCKET:-colpsi-bucket};
      exit 0;
      "

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    ports:
      - "21337:80" # Mapea el puerto 21337 de tu máquina al 80 del contenedor
    volumes:
      # Carpetas para tus archivos multimedia
      - ./biblioteca/audiobooks:/audiobooks
      - ./biblioteca/books:/books
      # Carpetas críticas donde se guarda tu progreso de lectura y configuración
      - ./biblioteca/config:/config
      - ./biblioteca/metadata:/metadata
    environment:
      - AUDIOBOOKSHELF_UID=1000
      - AUDIOBOOKSHELF_GID=1000
    # ABS es Node y puede pedir 1-2GB; topes para no ahogar el server de 8GB.
    cpus: "2.0"
    mem_limit: 1.5g
    networks:
      - colpsi_network

volumes:
  postgres_data:
  minio_data:
  valkey_data:
  imgcache_data:

networks:
  colpsi_network:
    driver: bridge