basePath: /api/v1
definitions:
  github_com_veniversvm_ColPsiCarabobo_api_internal_domain.Post:
    properties:
      create_by:
        description: CreateBy almacena el nombre o identificador textual del creador.
        type: string
      create_by_id:
        description: |-
          CreateById es el UUID del usuario/administrador que creó el registro.
          Es un puntero para permitir valores nulos si la creación es automática por el sistema.
        type: string
      created_at:
        description: |-
          CreatedAt registra la fecha y hora exacta en que se creó el registro.
          GORM gestiona este campo automáticamente durante la inserción.
        type: string
      id:
        type: string
      image_url:
        description: |-
          ImageS3Key almacena la ruta (Key) del archivo de imagen en el bucket de AWS S3/MinIO.
          No guardamos la URL completa para mantener flexibilidad si cambia el dominio del bucket.
        type: string
      is_active:
        description: IsActive permite el control de visibilidad (Borrador/Publicado).
        type: boolean
      short_description:
        description: |-
          ShortDescription actúa como un 'snippet' o resumen para las vistas de lista.
          Ayuda al SEO y a la experiencia de usuario antes de entrar al detalle.
        type: string
      text:
        allOf:
        - $ref: '#/definitions/github_com_veniversvm_ColPsiCarabobo_api_internal_domain.TextModel'
        description: |-
          Text es la instancia cargada del contenido.
          GORM permite cargar este campo mediante 'Preload' cuando se requiere el detalle completo.
      text_id:
        description: |-
          Relación con el texto largo.
          TextID es la clave foránea que apunta al contenido extenso en TextModel.
        type: string
      title:
        description: |-
          Title es el encabezado de la publicación.
          Limitado a 100 caracteres para optimizar la visualización en el frontend.
        type: string
      type:
        description: |-
          Type define el alcance de la publicación.
          Valores comunes: "public" (abierto a todos), "psi" (solo psicólogos logueados).
        type: string
      update_by:
        description: UpdateBy almacena el nombre o identificador textual de la última
          persona en modificarlo.
        type: string
      update_by_id:
        description: UpdateById es el UUID del usuario/administrador que realizó la
          última actualización.
        type: string
      updated_at:
        description: |-
          UpdatedAt registra la última fecha y hora en que se modificó el registro.
          GORM actualiza este valor automáticamente en cada operación de guardado.
        type: string
    type: object
