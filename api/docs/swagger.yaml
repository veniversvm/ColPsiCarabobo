basePath: /api/v1
definitions:
  domain.PsiSpecialtyModel:
    properties:
      active:
        type: boolean
      create_by:
        description: CreateBy almacena el nombre o identificador textual del creador.
        type: string
      create_by_id:
        description: |-
          CreateById es el UUID del usuario/administrador que creó el registro.
          Es un puntero para permitir valores nulos si la creación es automática por el sistema.
        type: string
      created_at:
        description: |-
          CreatedAt registra la fecha y hora exacta en que se creó el registro.
          GORM gestiona este campo automáticamente durante la inserción.
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      update_by:
        description: UpdateBy almacena el nombre o identificador textual de la última
          persona en modificarlo.
        type: string
      update_by_id:
        description: UpdateById es el UUID del usuario/administrador que realizó la
          última actualización.
        type: string
      updated_at:
        description: |-
          UpdatedAt registra la última fecha y hora en que se modificó el registro.
          GORM actualiza este valor automáticamente en cada operación de guardado.
        type: string
    type: object
  handler.LoginRequest:
    properties:
      identifier:
        example: admin
        type: string
      password:
        example: admin123
        type: string
    required:
    - identifier
    - password
    type: object
  request_structs.AdminPermissionsDTO:
    properties:
      can_create_admin:
        type: boolean
      can_create_psi:
        type: boolean
      can_create_tags:
        type: boolean
      can_delete_admin:
        type: boolean
      can_delete_psi:
        type: boolean
      can_delete_publish:
        type: boolean
      can_delete_tags:
        type: boolean
      can_edit_tags:
        type: boolean
      can_manage_notifications:
        type: boolean
      can_publish:
        type: boolean
      can_read_notifications:
        type: boolean
      can_send_notifications:
        type: boolean
      can_update_admin:
        type: boolean
      can_update_psi:
        type: boolean
      can_update_publish:
        type: boolean
    type: object
  request_structs.CreateAdminRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
      permissions:
        allOf:
        - $ref: '#/definitions/request_structs.AdminPermissionsDTO'
        description: Permisos que se le quieren asignar
      username:
        type: string
    required:
    - email
    - password
    - username
    type: object
  request_structs.CreateSpecialtyRequest:
    properties:
      description:
        example: Especialidad enfocada en...
        type: string
      name:
        example: Psicología Clínica
        type: string
    required:
    - name
    type: object
  request_structs.UpdateAdminRequest:
    properties:
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      password:
        type: string
      permissions:
        allOf:
        - $ref: '#/definitions/request_structs.AdminPermissionsDTO'
        description: Permisos
      username:
        type: string
    required:
    - id
    type: object
  request_structs.UpdateSpecialtyRequest:
    properties:
      active:
        type: boolean
      description:
        type: string
      name:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Backend para la gestión del Colegio de Psicólogos de Carabobo.
  title: ColPsiCarabobo API
  version: "1.0"
paths:
  /admin/create:
    post:
      consumes:
      - application/json
      description: Registra un nuevo miembro del staff administrativo verificando
        la jerarquía de permisos.
      parameters:
      - description: Datos del nuevo administrador y permisos
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request_structs.CreateAdminRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 'message: creado correctamente'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: datos inválidos'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: violación de jerarquía'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Crear un nuevo administrador
      tags:
      - Administración - Gestión
  /admin/delete/{id}:
    delete:
      description: Realiza un borrado lógico del administrador. No permite auto-eliminación
        ni borrar SUDO.
      parameters:
      - description: UUID del administrador
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'message: eliminado correctamente'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: ID inválido'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: permisos insuficientes'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Eliminar administrador (Soft-delete)
      tags:
      - Administración - Gestión
  /admin/list:
    get:
      description: Retorna una lista paginada de administradores con soporte para
        búsqueda y caché.
      parameters:
      - description: 'Número de página (def: 1)'
        in: query
        name: page
        type: integer
      - description: 'Registros por página (def: 10)'
        in: query
        name: limit
        type: integer
      - description: Búsqueda por username o email
        in: query
        name: search
        type: string
      - description: Filtrar por estado activo (true/false)
        in: query
        name: active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: data, total, page, limit
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 'error: fallo interno'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Listar administradores
      tags:
      - Administración - Gestión
  /admin/specialties:
    post:
      consumes:
      - application/json
      description: Registra una especialidad. Solo accesible para administradores
        autorizados.
      parameters:
      - description: Datos de la nueva especialidad
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request_structs.CreateSpecialtyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 'message: Especialidad creada'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: permiso denegado'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Crear nueva especialidad
      tags:
      - Administración - Especialidades
  /admin/specialties/{id}:
    delete:
      description: Marca una especialidad como inactiva. Solo Admin.
      parameters:
      - description: ID de la especialidad
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: 'message: Especialidad desactivada'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Eliminar especialidad (Soft-delete)
      tags:
      - Administración - Especialidades
    patch:
      consumes:
      - application/json
      description: Modifica campos de una especialidad. Actualiza automáticamente
        la auditoría (UpdateBy).
      parameters:
      - description: ID de la especialidad
        in: path
        name: id
        required: true
        type: integer
      - description: Campos parciales a modificar
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request_structs.UpdateSpecialtyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'message: Especialidad actualizada'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: permiso denegado'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Actualizar especialidad
      tags:
      - Administración - Especialidades
  /admin/specialties/all:
    get:
      description: Retorna todas las especialidades sin filtros de estado. Uso para
        paneles de gestión.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.PsiSpecialtyModel'
            type: array
        "403":
          description: 'error: permisos insuficientes'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Listado administrativo total
      tags:
      - Administración - Especialidades
  /admin/update:
    patch:
      consumes:
      - application/json
      description: Modifica los datos y permisos de un administrador. Actualiza automáticamente
        la auditoría.
      parameters:
      - description: Campos parciales a actualizar
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request_structs.UpdateAdminRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'message: actualizado correctamente'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: permiso denegado'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Actualizar administrador
      tags:
      - Administración - Gestión
  /auth/login:
    post:
      consumes:
      - application/json
      description: Valida las credenciales del administrador (email o username) y
        retorna un JWT dinámico.
      parameters:
      - description: Credenciales de acceso
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: message, token
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 'error: formato inválido'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: credenciales inválidas'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Iniciar sesión administrativo
      tags:
      - Administración - Auth
  /psi/upload-csv:
    post:
      consumes:
      - multipart/form-data
      description: Procesa un archivo CSV y crea registros. Solo accesible para administradores
        autorizados.
      parameters:
      - description: Archivo CSV a procesar
        in: formData
        name: csv
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Retornado si el usuario no tiene permisos (Security by Obscurity)
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Importar psicólogos masivamente
      tags:
      - Psychologists
  /specialties:
    get:
      description: Retorna el catálogo. Los usuarios ven solo las activas. Admins
        con permiso pueden filtrar por ?status=active|inactive|all.
      parameters:
      - description: 'Filtro administrativo: active, inactive, all (Default: active)'
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.PsiSpecialtyModel'
            type: array
        "500":
          description: error al recuperar especialidades
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Listar especialidades (Público/Admin)
      tags:
      - Catálogos - Especialidades
  /specialties/{id}:
    get:
      description: Retorna el detalle completo de una especialidad específica mediante
        su ID numérico.
      parameters:
      - description: ID único de la especialidad (uint32)
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.PsiSpecialtyModel'
        "400":
          description: ID inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: especialidad no encontrada
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtener especialidad por ID
      tags:
      - Catálogos - Especialidades
  /specialties/count:
    get:
      description: 'Obtiene el número total. Público: solo activas. Admin: permite
        filtrar por ?active=true|false.'
      parameters:
      - description: Filtrar por estado (Solo Admins)
        in: query
        name: active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: count
          schema:
            additionalProperties:
              format: int64
              type: integer
            type: object
      summary: Contar total de especialidades
      tags:
      - Catálogos - Especialidades
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
