host: localhost:8080
info:
  contact: {}
  description: Backend para la gestión del Colegio de Psicólogos de Carabobo.
  title: ColPsiCarabobo API
  version: "1.0"
paths:
  /admin/create:
    post:
      consumes:
      - application/json
      description: Registra un nuevo miembro del staff administrativo verificando
        la jerarquía de permisos.
      parameters:
      - description: Datos del nuevo administrador y permisos
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_veniversvm_ColPsiCarabobo_api_internal_request_structs.CreateAdminRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 'message: creado correctamente'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: datos inválidos'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: violación de jerarquía'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Crear un nuevo administrador
      tags:
      - Administración - Gestión
  /admin/delete/{id}:
    delete:
      description: Realiza un borrado lógico del administrador. No permite auto-eliminación
        ni borrar SUDO.
      parameters:
      - description: UUID del administrador
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'message: eliminado correctamente'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: ID inválido'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: permisos insuficientes'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Eliminar administrador (Soft-delete)
      tags:
      - Administración - Gestión
  /admin/list:
    get:
      description: Retorna una lista paginada de administradores con soporte para
        búsqueda y caché.
      parameters:
      - description: 'Número de página (def: 1)'
        in: query
        name: page
        type: integer
      - description: 'Registros por página (def: 10)'
        in: query
        name: limit
        type: integer
      - description: Búsqueda por username o email
        in: query
        name: search
        type: string
      - description: Filtrar por estado activo (true/false)
        in: query
        name: active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: data, total, page, limit
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 'error: fallo interno'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Listar administradores
      tags:
      - Administración - Gestión
  /admin/posts:
    post:
      consumes:
      - multipart/form-data
      description: Crea un post con contenido HTML y opcionalmente una imagen.
      parameters:
      - description: Título del post
        in: formData
        name: title
        required: true
        type: string
      - description: Resumen para el feed
        in: formData
        name: short_description
        type: string
      - description: Contenido HTML/Texto
        in: formData
        name: content
        required: true
        type: string
      - description: 'Tipo: public, psi'
        in: formData
        name: type
        required: true
        type: string
      - description: Visible inmediatamente
        in: formData
        name: is_active
        required: true
        type: boolean
      - description: Imagen de portada
        in: formData
        name: image
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Publicar nueva noticia
      tags:
      - Administración - Publicaciones
  /admin/posts/{id}:
    patch:
      consumes:
      - multipart/form-data
      description: Actualiza metadatos e imagen. El ID se obtiene de la URL. Los campos
        son opcionales (PATCH).
      parameters:
      - description: UUID de la publicación
        in: path
        name: id
        required: true
        type: string
      - description: Nuevo título
        in: formData
        name: title
        type: string
      - description: Descripción corta
        in: formData
        name: short_description
        type: string
      - description: Contenido detallado
        in: formData
        name: content
        type: string
      - description: Tipo de post
        in: formData
        name: type
        type: string
      - description: Estado de activación
        in: formData
        name: is_active
        type: boolean
      - description: Nueva imagen de portada
        in: formData
        name: image
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: '{"message": "Publicación actualizada"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: '{"error": "Datos inválidos"}'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Actualizar publicación
      tags:
      - Administración - Publicaciones
  /admin/psi/{id}:
    delete:
      description: Marca a un psicólogo como eliminado. El registro permanece en la
        base de datos para auditoría legal pero queda invisible en el sistema.
      parameters:
      - description: UUID del Psicólogo
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'message: Psicólogo eliminado correctamente'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: No autorizado'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: Permisos insuficientes'
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 'error: Registro no encontrado'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Eliminar psicólogo (Soft Delete)
      tags:
      - Administración - Psicólogos
    get:
      description: Retorna TODA la información del psicólogo (Identidad, Privacidad,
        ColData, Postgrados y RRSS). Ignora configuraciones de privacidad del usuario.
      parameters:
      - description: UUID del Psicólogo
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_veniversvm_ColPsiCarabobo_api_internal_domain.PsiUserModel'
        "400":
          description: ID inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Permiso denegado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Psicólogo no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Ver expediente completo (Admin)
      tags:
      - Administración - Psicólogos
    patch:
      consumes:
      - application/json
      description: Permite a un administrador modificar CUALQUIER campo del psicólogo
        (Identidad legal, solvencia, datos gremiales). Soporta actualizaciones parciales
        (PATCH).
      parameters:
      - description: UUID del Psicólogo
        in: path
        name: id
        required: true
        type: string
      - description: Campos a modificar (solo enviar los necesarios)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_veniversvm_ColPsiCarabobo_api_internal_request_structs.UpdatePsiAdminRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'message: Perfil actualizado por administración'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: ID inválido o sin campos para actualizar'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: Permisos insuficientes para editar este registro'
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 'error: Registro no encontrado'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Editar perfil completo de psicólogo
      tags:
      - Administración - Psicólogos
  /admin/psi/create:
    post:
      consumes:
      - application/json
      description: Permite a un administrador crear un nuevo perfil de psicólogo junto
        con sus datos colegiales básicos en una sola transacción.
      parameters:
      - description: Datos de identidad, contacto y registro colegial
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_veniversvm_ColPsiCarabobo_api_internal_request_structs.CreatePsiAdminRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 'message: Psicólogo registrado con éxito'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: JSON malformado o validación fallida'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: No autorizado'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Fallo interno al crear el registro'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Registrar psicólogo (Manual/Individual)
      tags:
      - Administración - Psicólogos
  /admin/psi/list:
    get:
      description: Buscador total de psicólogos. Ignora las reglas de solvencia e
        inactividad. Solo Admin.
      parameters:
      - description: Búsqueda por Nombre, CI, FPV
        in: query
        name: q
        type: string
      - description: ID Especialidad
        in: query
        name: specialty
        type: integer
      - description: Municipio o Estado
        in: query
        name: location
        type: string
      - description: Género (M/F)
        in: query
        name: gender
        type: string
      - description: 'Página (Def: 1)'
        in: query
        name: page
        type: integer
      - description: 'Límite (Def: 12)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Listado administrativo de psicólogos
      tags:
      - Administración - Psicólogos
  /admin/psi/social/{id}:
    delete:
      description: Puede ser usado por el psicólogo dueño o por un Administrador.
      parameters:
      - description: UUID de la red
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Borrar red social (Soft Delete)
      tags:
      - Psicólogos - Perfil
  /admin/psi/upload-csv:
    post:
      consumes:
      - multipart/form-data
      description: Procesa un archivo CSV y crea registros. Solo accesible para administradores
        autorizados.
      parameters:
      - description: Archivo CSV a procesar
        in: formData
        name: csv
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Retornado si el usuario no tiene permisos (Security by Obscurity)
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Importar psicólogos masivamente
      tags:
      - Administración - Psicólogos  <-- Tag corregido para agruparlo bien
  /admin/specialties:
    post:
      consumes:
      - application/json
      description: Registra una especialidad. Solo accesible para administradores
        autorizados.
      parameters:
      - description: Datos de la nueva especialidad
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_veniversvm_ColPsiCarabobo_api_internal_request_structs.CreateSpecialtyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 'message: Especialidad creada'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: permiso denegado'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Crear nueva especialidad
      tags:
      - Administración - Especialidades
  /admin/specialties/{id}:
    delete:
      description: Marca una especialidad como inactiva. Solo Admin.
      parameters:
      - description: ID de la especialidad
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: 'message: Especialidad desactivada'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Eliminar especialidad (Soft-delete)
      tags:
      - Administración - Especialidades
    patch:
      consumes:
      - application/json
      description: Modifica campos de una especialidad. Actualiza automáticamente
        la auditoría (UpdateBy).
      parameters:
      - description: ID de la especialidad
        in: path
        name: id
        required: true
        type: integer
      - description: Campos parciales a modificar
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_veniversvm_ColPsiCarabobo_api_internal_request_structs.UpdateSpecialtyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'message: Especialidad actualizada'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: permiso denegado'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Actualizar especialidad
      tags:
      - Administración - Especialidades
  /admin/specialties/all:
    get:
      description: Retorna todas las especialidades sin filtros de estado. Uso para
        paneles de gestión.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_veniversvm_ColPsiCarabobo_api_internal_domain.PsiSpecialtyModel'
            type: array
        "403":
          description: 'error: permisos insuficientes'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Listado administrativo total
      tags:
      - Administración - Especialidades
  /admin/update:
    patch:
      consumes:
      - application/json
      description: Modifica los datos y permisos de un administrador. Actualiza automáticamente
        la auditoría.
      parameters:
      - description: Campos parciales a actualizar
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_veniversvm_ColPsiCarabobo_api_internal_request_structs.UpdateAdminRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'message: actualizado correctamente'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: permiso denegado'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Actualizar administrador
      tags:
      - Administración - Gestión
  /auth/login:
    post:
      consumes:
      - application/json
      description: Valida las credenciales del administrador (email o username) y
        retorna un JWT dinámico.
      parameters:
      - description: Credenciales de acceso
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: message, token
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 'error: formato inválido'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: credenciales inválidas'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Iniciar sesión administrativo
      tags:
      - Administración - Auth
  /posts:
    get:
      description: 'Obtiene noticias. El contenido varía según el usuario: Público
        (solo noticias generales), Psicólogo (generales + gremiales), Admin (todo).'
      parameters:
      - description: 'Número de página (Default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items por página (Default: 10)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: data, total, page
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Listar noticias y publicaciones
      tags:
      - Publicaciones
  /posts/{id}:
    get:
      description: Devuelve el detalle de la noticia incluyendo el contenido HTML.
        Valida permisos de visibilidad.
      parameters:
      - description: UUID del Post
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_veniversvm_ColPsiCarabobo_api_internal_domain.Post'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtener noticia por ID
      tags:
      - Publicaciones
  /psi/{id}:
    get:
      description: Retorna la ficha técnica. Oculta datos privados (teléfono, email)
        según configuración del usuario.
      parameters:
      - description: UUID del Psicólogo
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_veniversvm_ColPsiCarabobo_api_internal_request_structs.PsiFullProfileDTO'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Ver perfil público de psicólogo
      tags:
      - Psicólogos - Público
  /psi/directory:
    get:
      description: Motor de búsqueda avanzado. Si se usa 'q', busca por identidad
        (ignora solvencia). Si no se usa 'q', solo muestra solventes y aplica filtros
        de ubicación/especialidad.
      parameters:
      - description: Búsqueda por Nombre, Apellido, CI o FPV
        in: query
        name: q
        type: string
      - description: ID de la Especialidad (Catálogo Maestro)
        in: query
        name: specialty
        type: integer
      - description: Municipio o Estado
        in: query
        name: location
        type: string
      - description: 'Género: M o F'
        in: query
        name: gender
        type: string
      - description: 'Página (Def: 1)'
        in: query
        name: page
        type: integer
      - description: 'Límite (Def: 12)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Directorio Público de Psicólogos
      tags:
      - Psicólogos - Público
  /psi/login:
    post:
      consumes:
      - application/json
      description: Autentica a un agremiado y retorna un token de sesión.
      parameters:
      - description: Credenciales
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_veniversvm_ColPsiCarabobo_api_internal_request_structs.PsiLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login de Psicólogo
      tags:
      - Psicólogos - Auth
  /psi/me:
    get:
      description: Retorna toda la información del psicólogo autenticado (sin aplicar
        filtros de privacidad o solvencia). Ideal para el Dashboard del usuario.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_veniversvm_ColPsiCarabobo_api_internal_domain.PsiUserModel'
        "401":
          description: No autorizado
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Obtener mi propio perfil (Autogestión)
      tags:
      - Psicólogos - Perfil
    patch:
      consumes:
      - application/json
      description: Permite al psicólogo actualizar su información de contacto y visibilidad.
      parameters:
      - description: Datos editables
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_veniversvm_ColPsiCarabobo_api_internal_request_structs.PsiUserUpdateRequestSelf'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
