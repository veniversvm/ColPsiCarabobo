        example: El comprobante fue validado
        maxLength: 500
        type: string
    required:
    - estado_id
    type: object
  request_structs.UpdateTicketEstadoRequest:
    properties:
      is_closed:
        example: false
        type: boolean
      name:
        example: En revisión
        type: string
      order:
        example: 2
        type: integer
    type: object
  request_structs.UpdateTicketMotivoRequest:
    properties:
      description:
        example: Nueva descripción
        type: string
      name:
        example: Solicitudes
        type: string
      tickets_per_psi:
        example: 5
        type: integer
    type: object
  service.BirthdayInfoProjection:
    properties:
      day:
        type: integer
      first_name:
        type: string
      fpv:
        type: integer
      id:
        type: string
      is_active:
        type: boolean
      last_name:
        type: string
      month:
        description: Mes y día del cumpleaños (para mostrarlos como fecha sin exponer
          el año real).
        type: integer
    type: object
  service.PermissionSet:
    properties:
      can_create_admin:
        type: boolean
      can_create_psi:
        type: boolean
      can_create_tags:
        type: boolean
      can_delete_admin:
        type: boolean
      can_delete_psi:
        type: boolean
      can_delete_publish:
        type: boolean
      can_delete_tags:
        type: boolean
      can_edit_tags:
        type: boolean
      can_manage_notifications:
        type: boolean
      can_manage_projects:
        type: boolean
      can_manage_tickets:
        type: boolean
      can_publish:
        type: boolean
      can_read_notifications:
        type: boolean
      can_read_psi:
        type: boolean
      can_send_notifications:
        type: boolean
      can_update_admin:
        type: boolean
      can_update_psi:
        type: boolean
      can_update_publish:
        type: boolean
    type: object
  service.RolePreset:
    properties:
      description:
        type: string
      name:
        type: string
      permissions:
        $ref: '#/definitions/service.PermissionSet'
      slug:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Backend para la gestión del Colegio de Psicólogos de Carabobo.
  title: ColPsiCarabobo API
  version: "1.0"
paths:
  /admin/create:
    post:
      consumes:
      - application/json
      description: Registra un nuevo miembro del staff administrativo verificando
        la jerarquía de permisos.
      parameters:
      - description: Datos del nuevo administrador y permisos
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request_structs.CreateAdminRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 'message: creado correctamente'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: datos inválidos'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: violación de jerarquía'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Crear un nuevo administrador
      tags:
      - Administración - Gestión
  /admin/delete/{id}:
    delete:
      description: Realiza un borrado lógico del administrador. No permite auto-eliminación
        ni borrar SUDO.
      parameters:
      - description: UUID del administrador
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'message: eliminado correctamente'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: ID inválido'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: permisos insuficientes'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Eliminar administrador (Soft-delete)
      tags:
      - Administración - Gestión
  /admin/inscripciones/{id}:
    delete:
      description: Elimina la solicitud y sus archivos S3.
      responses: {}
      security:
      - BearerAuth: []
      summary: Rechazar inscripción (admin)
      tags:
      - Administración - Inscripciones
    get:
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Detalle de solicitud (admin)
      tags:
      - Administración - Inscripciones
    patch:
      consumes:
      - application/json
      description: Actualiza los campos escalares de la ficha (ubicación, modalidades,
        áreas, datos personales). Solo admins con permiso de edición de psicólogos.
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Editar ficha de inscripción (admin)
      tags:
      - Administración - Inscripciones
  /admin/inscripciones/{id}/approve:
    post:
      description: Aprueba la solicitud, crea el psicólogo con is_active=false y envía
        email con credenciales.
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Aprobar inscripción (admin)
      tags:
      - Administración - Inscripciones
  /admin/inscripciones/{id}/documents:
    post:
      consumes:
      - multipart/form-data
      description: Agrega o reemplaza la foto de un documento de la ficha (cedula,
        titulo, rif, otro).
      parameters:
      - description: cedula | titulo | rif | otro
        in: formData
        name: document_type
        required: true
        type: string
      - description: Archivo de imagen o PDF
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Agregar o reemplazar foto de documento (admin)
      tags:
      - Administración - Inscripciones
  /admin/inscripciones/{id}/documents/{docId}:
    delete:
      description: Elimina la foto de un documento de la ficha y su archivo en el
        bucket.
      responses: {}
      security:
      - BearerAuth: []
      summary: Eliminar foto de documento (admin)
      tags:
      - Administración - Inscripciones
  /admin/inscripciones/{id}/email:
    post:
      consumes:
      - application/json
      description: Envía un correo con asunto y mensaje del administrador al correo
        del solicitante.
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Enviar correo al solicitante (admin)
      tags:
      - Administración - Inscripciones
  /admin/inscripciones/{id}/notes:
    patch:
      consumes:
      - application/json
      description: Persiste las notas de texto simple del administrador sobre la solicitud.
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Guardar notas administrativas (admin)
      tags:
      - Administración - Inscripciones
  /admin/inscripciones/{id}/photo:
    post:
      consumes:
      - multipart/form-data
      description: Reemplaza la foto tipo carnet o el comprobante de pago de la ficha.
      parameters:
      - description: foto | comprobante
        in: formData
        name: kind
        required: true
        type: string
      - description: Archivo de imagen o PDF
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Reemplazar foto de la ficha (admin)
      tags:
      - Administración - Inscripciones
  /admin/inscripciones/list:
    get:
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Listar solicitudes de inscripción (admin)
      tags:
      - Administración - Inscripciones
  /admin/list:
    get:
      description: Retorna una lista paginada de administradores con soporte para
        búsqueda y caché.
      parameters:
      - description: 'Número de página (def: 1)'
        in: query
        name: page
        type: integer
      - description: 'Registros por página (def: 10)'
        in: query
        name: limit
        type: integer
      - description: Búsqueda por username o email
        in: query
        name: search
        type: string
      - description: Filtrar por estado activo (true/false)
        in: query
        name: active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: data, total, page, limit
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 'error: fallo interno'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Listar administradores
      tags:
      - Administración - Gestión
  /admin/me:
    get:
      description: 'Retorna identidad, rol y matriz de permisos del administrador
        actual. La UI lo usa para filtrar el menú; es informativo, nunca autoriza:
        el backend valida cada operación.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Estado y permisos del administrador autenticado
      tags:
      - Administración - Sesión
  /admin/posts:
    post:
      consumes:
      - multipart/form-data
      description: Crea un post con contenido HTML y opcionalmente una imagen. El
        campo 'status' controla el ciclo de vida.
      parameters:
      - description: Título del post (max 100 chars)
        in: formData
        name: title
        required: true
        type: string
      - description: Resumen para el feed (max 250 chars)
        in: formData
        name: short_description
        type: string
      - description: Contenido HTML/Texto
        in: formData
        name: content
        required: true
        type: string
      - description: 'Visibilidad: public | psi'
        in: formData
        name: type
        required: true
        type: string
      - description: 'Estado: draft | published | archived | scheduled'
        in: formData
        name: status
        required: true
        type: string
      - description: Fecha ISO8601 de publicación — obligatorio si status=scheduled
        in: formData
        name: publish_at
        type: string
      - description: Imagen de portada
        in: formData
        name: image
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Crear nueva publicación
      tags:
      - Administración - Publicaciones
  /admin/posts/{id}:
    patch:
      consumes:
      - multipart/form-data
      description: Edición parcial (PATCH). Solo los campos enviados se modifican.
        Permite cambiar el estado del ciclo de vida.
      parameters:
      - description: UUID de la publicación
        in: path
        name: id
        required: true
        type: string
      - description: Nuevo título
        in: formData
        name: title
        type: string
      - description: Nueva descripción corta
        in: formData
        name: short_description
        type: string
      - description: Nuevo contenido HTML
        in: formData
        name: content
        type: string
      - description: 'Nueva visibilidad: public | psi'
        in: formData
        name: type
        type: string
      - description: 'Nuevo estado: draft | published | archived | scheduled'
        in: formData
        name: status
        type: string
      - description: Nueva fecha de publicación — obligatorio si status=scheduled
        in: formData
        name: publish_at
        type: string
      - description: Nueva imagen de portada (reemplaza la anterior)
        in: formData
        name: image
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Actualizar publicación
      tags:
      - Administración - Publicaciones
  /admin/projects:
    get:
      description: Retorna los proyectos accesibles para el admin autenticado (dueños,
        miembro o master).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.KanbanProject'
            type: array
      security:
      - BearerAuth: []
      summary: Listar proyectos Kanban
      tags:
      - Administración - Proyectos (Kanban)
    post:
      consumes:
      - application/json
      description: Crea un proyecto (el admin autenticado es el dueño) y siembra las
        columnas por defecto.
      parameters:
      - description: Datos del proyecto
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request_structs.CreateProjectRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.KanbanProject'
      security:
      - BearerAuth: []
      summary: Crear proyecto Kanban
      tags:
      - Administración - Proyectos (Kanban)
  /admin/projects/{id}:
    delete:
      description: Elimina definitivamente el proyecto, columnas, tarjetas y notas
        (solo dueño o master).
      parameters:
      - description: UUID del proyecto
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Eliminar proyecto Kanban
      tags:
      - Administración - Proyectos (Kanban)
    get:
      description: 'Retorna el tablero completo: proyecto + columnas con sus tarjetas
        y notas.'
      parameters:
      - description: UUID del proyecto
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Tablero Kanban de un proyecto
      tags:
      - Administración - Proyectos (Kanban)
    patch:
      consumes:
      - application/json
      description: Renombra o edita la descripción de un proyecto (solo dueño o master).
      parameters:
      - description: UUID del proyecto
        in: path
        name: id
        required: true
        type: string
      - description: Campos a modificar
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request_structs.UpdateProjectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Actualizar proyecto Kanban
      tags:
      - Administración - Proyectos (Kanban)
  /admin/projects/{id}/cards:
    post:
      consumes:
      - application/json
      parameters:
      - description: UUID del proyecto
        in: path
        name: id
        required: true
        type: string
      - description: Datos de la tarjeta
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request_structs.CreateCardRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.KanbanCard'
      security:
      - BearerAuth: []
      summary: Crear tarjeta Kanban
      tags:
      - Administración - Proyectos (Kanban)
  /admin/projects/{id}/columns:
    post:
      consumes:
      - application/json
      parameters:
      - description: UUID del proyecto
        in: path
        name: id
        required: true
        type: string
      - description: Título de la columna
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request_structs.CreateColumnRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.KanbanColumn'
      security:
      - BearerAuth: []
      summary: Crear columna en el tablero
      tags:
      - Administración - Proyectos (Kanban)
  /admin/projects/{id}/members:
    get:
      parameters:
      - description: UUID del proyecto
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.KanbanMember'
            type: array
      security:
      - BearerAuth: []
      summary: Listar miembros de un proyecto
      tags:
      - Administración - Proyectos (Kanban)
    post:
      consumes:
      - application/json
      parameters:
      - description: UUID del proyecto
        in: path
        name: id
        required: true
        type: string
      - description: Admin objetivo + rol
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request_structs.AddMemberRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Invitar administrador a un proyecto
      tags:
      - Administración - Proyectos (Kanban)
  /admin/projects/cards/{cardId}:
    delete:
      parameters:
      - description: UUID de la tarjeta
        in: path
        name: cardId
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Eliminar tarjeta Kanban
      tags:
      - Administración - Proyectos (Kanban)
    patch:
      consumes:
      - application/json
      parameters:
      - description: UUID de la tarjeta
        in: path
        name: cardId
        required: true
        type: string
      - description: Campos a modificar
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request_structs.UpdateCardRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Actualizar o mover tarjeta Kanban
      tags:
      - Administración - Proyectos (Kanban)
  /admin/projects/cards/{cardId}/notes:
    post:
      consumes:
      - application/json
      description: Cada tarjeta admite hasta 10 notas de máximo 500 caracteres.
      parameters:
      - description: UUID de la tarjeta
        in: path
        name: cardId
        required: true
        type: string
      - description: Contenido de la nota
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request_structs.CreateNoteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.KanbanNote'
      security:
      - BearerAuth: []
      summary: Añadir nota a una tarjeta
      tags:
      - Administración - Proyectos (Kanban)
  /admin/projects/columns/{columnId}:
    delete:
      parameters:
      - description: UUID de la columna
        in: path
        name: columnId
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Eliminar columna
      tags:
      - Administración - Proyectos (Kanban)
    patch:
      consumes:
      - application/json
      parameters:
      - description: UUID de la columna
        in: path
        name: columnId
        required: true
        type: string
      - description: Campos a modificar
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request_structs.UpdateColumnRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Actualizar columna
      tags:
      - Administración - Proyectos (Kanban)
  /admin/projects/members/{memberId}:
    delete:
      parameters:
      - description: UUID del miembro
        in: path
        name: memberId
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Quitar miembro de un proyecto
      tags:
      - Administración - Proyectos (Kanban)
    patch:
      consumes:
      - application/json
      parameters:
      - description: UUID del miembro
        in: path
        name: memberId
        required: true
        type: string
      - description: Nuevo rol
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request_structs.UpdateMemberRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cambiar rol de un miembro
      tags:
      - Administración - Proyectos (Kanban)
  /admin/projects/notes/{noteId}:
    delete:
      description: Solo el autor de la nota, el dueño del proyecto o un master pueden
        borrarla.
      parameters:
      - description: UUID de la nota
        in: path
        name: noteId
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Eliminar nota de una tarjeta
      tags:
      - Administración - Proyectos (Kanban)
  /admin/psi/{id}:
    delete:
      description: Marca a un psicólogo como eliminado. El registro permanece en la
        base de datos para auditoría legal pero queda invisible en el sistema.
      parameters:
      - description: UUID del Psicólogo
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'message: Psicólogo eliminado correctamente'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: No autorizado'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: Permisos insuficientes'
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 'error: Registro no encontrado'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Eliminar psicólogo (Soft Delete)
      tags:
      - Administración - Psicólogos
    get:
      description: Retorna TODA la información del psicólogo (Identidad, Privacidad,
        ColData, Postgrados y RRSS). Ignora configuraciones de privacidad del usuario.
      parameters:
      - description: UUID del Psicólogo
        in: path
        name: id
        required: true
        type: string
