    properties:
      is_active:
        description: |-
          IsActive funciona como un interruptor de visibilidad (Soft-Disable).
          Regla de Negocio: Permite al usuario ocultar temporalmente la red social de
          su perfil público (ej. si está rediseñando su Instagram) sin necesidad de
          ejecutar un DELETE físico que destruiría el registro permanentemente.
        example: true
        type: boolean
      name:
        description: Name permite corregir un error tipográfico o cambiar el alias
          de la plataforma.
        example: Instagram
        type: string
      url:
        description: URL permite actualizar el enlace en caso de que el profesional
          cambie su handle/arroba.
        example: https://instagram.com/nuevo_perfil
        type: string
    type: object
  request_structs.UpdateSpecialtyRequest:
    properties:
      active:
        description: |-
          Active funciona como un interruptor de visibilidad (Soft-Disable).
          Permite ocultar una especialidad deprecada del formulario de registro público
          sin borrarla, preservando la integridad referencial (Foreign Keys) de los
          psicólogos antiguos que ya la tienen asignada.
          Al ser *bool, evitamos que la ausencia del campo en el payload la desactive por accidente.
        example: true
        type: boolean
      description:
        description: Description es opcional. Permite redefinir o corregir la explicación
          del área clínica.
        example: Nueva descripción actualizada...
        type: string
      name:
        description: |-
          Name es opcional. Si se proporciona, el controlador/servicio debe validar
          que el nuevo nombre no colisione con otra especialidad existente (Restricción UNIQUE).
        example: Psicología Organizacional
        type: string
    type: object
