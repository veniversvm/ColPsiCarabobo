      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Notification'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Detalle de notificación (agremiado)
      tags:
      - Agremiado - Notificaciones
  /notifications/psi-user/{id}/attach/{attachId}:
    get:
      description: Retorna la URL pública de un adjunto si el agremiado es destinatario.
      parameters:
      - description: UUID de la notificación
        in: path
        name: id
        required: true
        type: string
      - description: UUID del adjunto
        in: path
        name: attachId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Descargar adjunto de notificación
      tags:
      - Agremiado - Notificaciones
  /notifications/psi-user/unread-count:
    get:
      description: Retorna el número de notificaciones no leídas del agremiado (para
        badge).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              format: int64
              type: integer
            type: object
      security:
      - BearerAuth: []
      summary: Contador de notificaciones no leídas
      tags:
      - Agremiado - Notificaciones
  /posts:
    get:
      description: 'Obtiene noticias. El contenido varía según el usuario: Público
        (solo publicados públicos), Psicólogo (públicos + gremiales), Admin (todos
        los estados).'
      parameters:
      - description: 'Número de página (Default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items por página (Default: 10)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: data, total, page
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Listar noticias y publicaciones
      tags:
      - Publicaciones
  /posts/{id}:
    get:
      description: Devuelve el detalle completo incluyendo contenido HTML. Aplica
        ACL según el rol del solicitante.
      parameters:
      - description: UUID del Post
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Post'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtener publicación por ID
      tags:
      - Publicaciones
  /psi/{id}:
    get:
      description: Retorna la ficha técnica. Oculta datos privados según configuración
        del usuario.
      parameters:
      - description: FPV del Psicólogo
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/request_structs.PsiFullProfileDTO'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Ver perfil público de psicólogo
      tags:
      - Psicólogos - Público
  /psi/directory:
    get:
      description: Motor de búsqueda avanzado con filtros de especialidad, ubicación
        y género.
      parameters:
      - description: Búsqueda por Nombre, Apellido, CI o FPV
        in: query
        name: q
        type: string
      - description: ID de la Especialidad
        in: query
        name: specialty
        type: integer
      - description: Municipio o Estado
        in: query
        name: location
        type: string
      - description: 'Género: M o F'
        in: query
        name: gender
        type: string
      - description: 'Página (Def: 1)'
        in: query
        name: page
        type: integer
      - description: 'Límite (Def: 12)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Directorio Público de Psicólogos
      tags:
      - Psicólogos - Público
  /psi/login:
    post:
      consumes:
      - application/json
      description: Autentica a un agremiado y retorna un token de sesión.
      parameters:
      - description: Credenciales
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request_structs.PsiLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login de Psicólogo
      tags:
      - Psicólogos - Auth
  /psi/login-library:
    post:
      consumes:
      - application/json
      description: Autentica y retorna token SSO para el microservicio de biblioteca.
      parameters:
      - description: Credenciales
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request_structs.PsiLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login para Biblioteca (Audiobookshelf)
      tags:
      - Psicólogos - Auth
  /psi/logout:
    post:
      description: Invalida el token activo rotando la key de firma. Elimina la sesión
        activa de las estadísticas.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Logout de Psicólogo
      tags:
      - Psicólogos - Auth
  /psi/me:
    get:
      description: Retorna toda la información del psicólogo autenticado sin filtros
        de privacidad.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.PsiUserModel'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Obtener mi propio perfil (Autogestión)
      tags:
      - Psicólogos - Perfil
    patch:
      consumes:
      - multipart/form-data
      parameters:
      - description: Contraseña actual obligatoria
        in: formData
        name: password
        required: true
        type: string
      - description: Nuevo nombre de usuario
        in: formData
        name: username
        type: string
      - description: Imagen de perfil (JPEG/PNG)
        in: formData
        name: profile_picture
        type: file
      - description: Imagen del título 1
        in: formData
        name: title_image_one
        type: file
      - description: Imagen del título 2
        in: formData
        name: title_image_two
        type: file
      - description: Imagen del título 3
        in: formData
        name: title_image_three
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Actualizar mi perfil (Autogestión)
      tags:
      - Psicólogos - Perfil
  /psi/me/audiobookshelf:
    get:
      description: Devuelve la URL de auto-login a Audiobookshelf. Solo agremiados
        solventes. Si el psicólogo no tiene cuenta en ABS, se crea automáticamente.
      produces:
      - application/json
      responses:
        "200":
          description: url, username, created
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Solo agremiados solventes
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Audiobookshelf no disponible
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Acceso a la biblioteca digital (Audiobookshelf)
      tags:
      - Psicólogos - Perfil
  /psi/me/documents:
    get:
      description: 'Retorna los documentos digitales del psicólogo autenticado (CI,
        título, RIF, comprobantes, etc.). Es SOLO LECTURA: el psicólogo nunca puede
        editar ni eliminar estos documentos; su gestión es exclusiva de la administración.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.PsiUserDocument'
            type: array
        "401":
          description: No autenticado
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Mis documentos digitales (Psi)
      tags:
      - Psicólogos - Expediente
  /psi/me/postgrades:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Título obtenido
        in: formData
        name: title
        required: true
        type: string
      - description: Universidad
        in: formData
        name: university
        required: true
        type: string
      - description: Año de graduación
        in: formData
        name: graduation_year
        required: true
        type: integer
      - description: Descripción opcional
        in: formData
        name: description
        type: string
      - description: Imagen del Título
        in: formData
        name: pic_one
        type: file
      - description: Imagen de Notas
        in: formData
        name: pic_two
        type: file
      - description: Imagen Extra
        in: formData
        name: pic_three
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Agregar postgrado con soportes
      tags:
      - Psicólogos - Académico
  /psi/me/postgrades/{id}:
    patch:
      consumes:
      - multipart/form-data
      parameters:
      - description: ID del Postgrado
        in: path
        name: id
        required: true
        type: string
      - description: Título
        in: formData
        name: title
        type: string
      - description: Universidad
        in: formData
        name: university
        type: string
      - description: Año
        in: formData
        name: graduation_year
        type: integer
      - description: Descripción
        in: formData
        name: description
        type: string
      - description: Reemplazar Imagen 1
        in: formData
        name: pic_one
        type: file
      - description: Reemplazar Imagen 2
        in: formData
        name: pic_two
        type: file
      - description: Reemplazar Imagen 3
        in: formData
        name: pic_three
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Actualizar postgrado
      tags:
      - Psicólogos - Académico
  /psi/me/social:
    post:
      consumes:
      - application/json
      parameters:
      - description: Datos de la red
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request_structs.CreateSocialNetworkRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Agregar red social
      tags:
      - Psicólogos - Perfil
  /psi/me/social/{id}:
    delete:
      description: Puede ser usado por el psicólogo dueño o por un Administrador.
      parameters:
      - description: UUID de la red
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Borrar red social (Soft Delete)
      tags:
      - Psicólogos - Perfil
    patch:
      consumes:
      - application/json
      parameters:
      - description: UUID de la red
        in: path
        name: id
        required: true
        type: string
      - description: Campos parciales
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request_structs.UpdateSocialNetworkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Actualizar red social
      tags:
      - Psicólogos - Perfil
  /psi/me/validate:
    get:
      description: Devuelve 200 si el token JWT es válido y la sesión sigue activa;
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Validar sesión de psicólogo
      tags:
      - Psicólogos - Sesión
  /psi/tickets:
    get:
      parameters:
      - description: Página
        in: query
        name: page
        type: integer
      - description: Límite
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Listar mis tickets
      tags:
      - Tickets - Portal Psi
    post:
      consumes:
      - application/json
      description: El psicólogo abre un ticket en un área/motivo con un título, descripción
        y anexos opcionales (multipart, campo "files").
      parameters:
      - description: Datos del ticket (o multipart)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request_structs.CreateTicketRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Ticket'
      security:
      - BearerAuth: []
      summary: Crear un ticket de solicitud
      tags:
      - Tickets - Portal Psi
  /psi/tickets/{id}:
    get:
      parameters:
      - description: ID del ticket
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Ticket'
      security:
      - BearerAuth: []
      summary: Ver detalle de un ticket propio
      tags:
      - Tickets - Portal Psi
  /psi/tickets/{id}/cerrar:
    post:
      consumes:
      - application/json
      description: El psicólogo cierra su propio ticket indicando un motivo de cierre
        obligatorio.
      parameters:
      - description: ID del ticket
        in: path
        name: id
        required: true
        type: string
      - description: Motivo de cierre
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request_structs.CloseTicketRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Ticket'
      security:
      - BearerAuth: []
      summary: Cerrar mi ticket
      tags:
      - Tickets - Portal Psi
  /psi/tickets/{id}/mensaje:
    post:
      consumes:
      - application/json
      description: Publica un mensaje en la conversación (máx 1000 chars, no más de
        3 seguidos). Anexos opcionales en multipart (campo "files").
      parameters:
      - description: ID del ticket
        in: path
        name: id
        required: true
        type: string
      - description: Mensaje (o multipart)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request_structs.AddMensajeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.TicketMensaje'
      security:
      - BearerAuth: []
      summary: Comentar en mi ticket
      tags:
      - Tickets - Portal Psi
  /psi/tickets/config:
    get:
      description: Retorna los motivos con sus estados (y su límite tickets_per_psi)
        para que el psi pueda crear un ticket.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.TicketMotivo'
            type: array
      security:
      - BearerAuth: []
      summary: Configuración de tickets para el psicólogo
      tags:
      - Tickets - Portal Psi
  /specialties:
    get:
      description: Retorna el catálogo. Los usuarios ven solo las activas. Admins
        con permiso pueden filtrar por ?status=active|inactive|all.
      parameters:
      - description: 'Filtro administrativo: active, inactive, all (Default: active)'
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.PsiSpecialtyModel'
            type: array
        "500":
          description: error al recuperar especialidades
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Listar especialidades (Público/Admin)
      tags:
      - Catálogos - Especialidades
  /specialties/{id}:
    get:
      description: Retorna el detalle completo de una especialidad específica mediante
        su ID numérico.
      parameters:
      - description: ID único de la especialidad (uint32)
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.PsiSpecialtyModel'
        "400":
          description: ID inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: especialidad no encontrada
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtener especialidad por ID
      tags:
      - Catálogos - Especialidades
  /specialties/count:
    get:
      description: 'Obtiene el número total. Público: solo activas. Admin: permite
        filtrar por ?active=true|false.'
      parameters:
      - description: Filtrar por estado (Solo Admins)
        in: query
        name: active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: count
          schema:
            additionalProperties:
              format: int64
              type: integer
            type: object
      summary: Contar total de especialidades
      tags:
      - Catálogos - Especialidades
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
