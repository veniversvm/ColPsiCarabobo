        type: boolean
      public_phone:
        type: string
      register_folio:
        type: string
      register_number:
        type: integer
      register_title_date:
        type: string
      register_title_state:
        type: string
      register_tome:
        type: string
      second_last_name:
        type: string
      second_name:
        type: string
      secondary_specialty:
        type: string
      service_address:
        type: string
      show_contact_email:
        type: boolean
      show_public_phone:
        type: boolean
      show_service_address:
        type: boolean
      sixty_five_or_plus:
        type: boolean
      solvent:
        description: Estatus Administrativo (Solo Admin)
        type: boolean
      state_outside:
        description: Si el psicologo esta fuera del estado Carabobo
        type: string
      university_professor:
        type: boolean
      university_undergraduate:
        description: Datos Colegiales (ColData - Solo Admin puede alterar la info)
        type: string
