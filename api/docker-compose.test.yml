services:
  db_test:
    image: postgres:18-alpine
    container_name: colpsi_test_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=colpsi_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d colpsi_test"]
      interval: 2s
      timeout: 3s
      retries: 10
    command: >
      postgres
        -c shared_preload_libraries=''
        -c fsync=off
        -c synchronous_commit=off
        -c full_page_writes=off
