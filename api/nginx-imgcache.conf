# api/nginx-imgcache.conf
# Edge cache Nginx delante de MinIO (colpsi_imgcache).
#
# Ocupa el puerto 9000 (S3_PUBLIC_URL) y cachea las imágenes en disco local:
#   - GET/HEAD de imágenes → proxy_cache (disco, 2 GB, 30 días de inactividad).
#   - Uploads (PUT/POST/PATCH/DELETE) y firma S3 → pasan transparentes a MinIO
#     preservando el header Host para no romper la firma v4.
#   - El cache key incluye la query string para respetar el cache-busting
#     (?v=updated_at) de los avatares.
#
# MinIO queda solo en la red interna (http://s3:9000) para el SDK.

# 3 workers (no las 4 vCPU del host): deja un núcleo libre para SO y resto.
worker_processes 3;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # DNS embebido de Docker: resuelve "s3" por request. Evita que MinIO quede
    # con IP vieja tras un recreate del contenedor (502 Connection refused).
    resolver 127.0.0.11 valid=30s ipv6=off;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=imgcache:10m max_size=2g inactive=30d use_temp_path=off;

    # Cache-Control por defecto según la carpeta (solo si el objeto no lo trae).
    map $uri $default_cc {
        "~^/[^/]*/avatars/"   "public, max-age=86400";
        default               "public, max-age=31536000, immutable";
    }

    # Usa el Cache-Control del objeto si existe; si no, el default por carpeta.
    map $upstream_http_cache_control $cc {
        default $upstream_http_cache_control;
        ""      $default_cc;
    }

    server {
        listen 80;
        server_name _;

        # Permite subidas a través del proxy (dev local usa localhost:9000).
        client_max_body_size 50m;

        location / {
            # Variable + resolver: el host "s3" se resuelve por request (la IP
            # del contenedor MinIO cambia al recrearlo; con upstream estático
            # nginx queda apuntando a una IP muerta → 502).
            set $minio_upstream http://s3:9000;
            proxy_pass $minio_upstream;
            proxy_http_version 1.1;

            # CRÍTICO: preservar el Host original para que la firma S3 v4 siga
            # siendo válida (MinIO la valida contra el Host recibido).
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Solo cachear GET/HEAD (default de nginx); uploads pasan sin cache.
            proxy_cache imgcache;
            proxy_cache_key $uri$is_args$args;
            proxy_cache_valid 200 365d;
            proxy_cache_lock on;
            proxy_cache_revalidate on;
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504 updating;

            # Nunca dejar pasar cookies en respuestas de imágenes.
            proxy_ignore_headers Set-Cookie;
            proxy_hide_header Set-Cookie;

            # El header Cache-Control lo controlamos nosotros (del objeto o default).
            proxy_hide_header Cache-Control;
            add_header Cache-Control $cc;
            add_header X-Cache-Status $upstream_cache_status;
        }
    }
}
