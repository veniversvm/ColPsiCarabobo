services:
  # --- FRONTEND (Deno + SolidJS SSR) ---
  frontend:
    image: denoland/deno:alpine
    container_name: colpsi_frontend
    working_dir: /app
    volumes:
      - ./web:/app
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://api:8080
      - DENO_ENV=development
    # Usamos --watch para que Deno reinicie al cambiar archivos en ./web
    command: run -A --unstable --watch main.ts 
    networks:
      - colpsi_network
    depends_on:
      - api

  # --- BACKEND (Go) ---
  api:
    build:
      context: ./api
      dockerfile: dockerfile # <--- Especificamos tu archivo en minúsculas
    container_name: colpsi_api
    env_file: ./api/.env # <--- Carga las variables desde tu carpeta api
    ports:
      - "8080:8080"
    environment:
      # Sobrescribimos la URL de la DB para que apunte al bouncer dentro de la red
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@pgbouncer:5432/${DB_NAME}?sslmode=disable
      - S3_ENDPOINT=http://s3:9000
    depends_on:
      - pgbouncer
      - s3
    networks:
      - colpsi_network

  # --- INFRAESTRUCTURA (DB & POOLING) ---
  db:
    image: postgres:17-alpine
    container_name: colpsi_db
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-colpsi_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - colpsi_network

  pgbouncer:
    image: edoburu/pgbouncer
    container_name: colpsi_pgbouncer
    environment:
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-colpsi_db}
      - POOL_MODE=transaction
      - AUTH_TYPE=scram-sha-256
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits,search_path
    depends_on:
      - db
    networks:
      - colpsi_network

  # --- ALMACENAMIENTO (MinIO) ---
  s3:
    image: minio/minio
    container_name: colpsi_s3
    environment:
      - MINIO_ROOT_USER=${AWS_ACCESS_KEY_ID:-minioadmin}
      - MINIO_ROOT_PASSWORD=${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    networks:
      - colpsi_network

  createbuckets:
    image: minio/mc
    depends_on:
      - s3
    networks:
      - colpsi_network
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://s3:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin}) do sleep 1; done;
      /usr/bin/mc mb --ignore-existing myminio/${AWS_S3_BUCKET:-colpsi-bucket};
      /usr/bin/mc anonymous set public myminio/${AWS_S3_BUCKET:-colpsi-bucket};
      exit 0;
      "

  # --- HERRAMIENTAS DEV ---
  pgadmin:
    image: dpage/pgadmin4
    container_name: colpsi_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    networks:
      - colpsi_network

volumes:
  postgres_data:
  minio_data:

networks:
  colpsi_network:
    driver: bridge